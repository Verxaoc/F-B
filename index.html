<!-- 1. Сюда автоматически вставится текст из вашего README.md -->
<div id="readme-content">Загрузка...</div>

<!-- 2. Подключаем скрипт-конвертер Markdown в HTML -->
<script src="https://jsdelivr.net"></script>

<!-- 3. Скрипт, который забирает и отображает текст -->
<script>
  // Ссылка на "сырой" файл в вашем репозитории (проверьте, main у вас или master)
  const readmeUrl = 'https://githubusercontent.com';

  fetch(readmeUrl)
    .then(res => res.text())
    .then(text => {
      document.getElementById('readme-content').innerHTML = marked.parse(text);
    })
    .catch(err => {
      document.getElementById('readme-content').innerHTML = 'Не удалось загрузить README.md';
      console.error(err);
    });
</script>
